<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Página não encontrada · Convencionados</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --accent: #0066cc; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f5f5f7; --muted: #86868b; --accent: #2997ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: "Geist", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 36rem; text-align: center; }
      h1 { font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -0.03em; margin: 0 0 12px; }
      p { color: var(--muted); font-size: 1.0625rem; line-height: 1.5; margin: 0 0 24px; }
      a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600; }
      a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Página não encontrada</h1>
      <p>O endereço pode estar errado ou o prestador já não constar da lista. Pesquise de novo a partir do início.</p>
      <a class="btn" href="/">Ir para a pesquisa</a>
    </main>
  </body>
</html>
